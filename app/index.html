<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Nights Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Vice Nights <span>Cover Studio</span></h1>
  <p class="hint">Click a panel to select it. Drag inside a panel to reposition its photo.</p>
</header>
<main class="layout">
  <section class="stage">
    <div id="poster" class="poster grade-sunset">
      <div class="panel" data-panel="0"><img alt="Panel 1 photo"><span class="badge">1</span></div>
      <div class="panel" data-panel="1"><img alt="Panel 2 photo"><span class="badge">2</span></div>
      <div class="panel" data-panel="2"><img alt="Panel 3 photo"><span class="badge">3</span></div>
      <div class="panel" data-panel="3"><img alt="Panel 4 photo"><span class="badge">4</span></div>
      <div class="titleblock">
        <div id="coverCaption" class="caption">VICE NIGHTS</div>
        <div id="coverTagline" class="tagline">One city. Every story.</div>
      </div>
      <div class="gradewash"></div>
    </div>
  </section>
  <aside class="controls">
    <label class="field">Main caption
      <input id="captionInput" type="text" value="VICE NIGHTS" maxlength="28">
    </label>
    <label class="field">Tagline
      <input id="taglineInput" type="text" value="One city. Every story." maxlength="48">
    </label>
    <div class="group">
      <h2>Selected panel photo</h2>
      <label class="btn">Choose photo for panel
        <input id="panelFile" type="file" accept="image/*" hidden>
      </label>
      <label class="btn">Fill all panels with one photo
        <input id="fillFile" type="file" accept="image/*" hidden>
      </label>
      <button id="samplesBtn" type="button">Reload sample scenes</button>
    </div>
    <label class="field">Zoom (selected panel)
      <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1">
    </label>
    <div class="group">
      <h2>Colour grade</h2>
      <div class="row">
        <button type="button" data-grade="sunset" class="gradeBtn active">Sunset Warm</button>
        <button type="button" data-grade="neon" class="gradeBtn">Neon Night</button>
        <button type="button" data-grade="dusk" class="gradeBtn">Dusky Haze</button>
      </div>
    </div>
    <div class="group">
      <h2>Export PNG</h2>
      <div class="row">
        <button type="button" data-export="1920x1080">1920 x 1080</button>
        <button type="button" data-export="1080x1080">1080 x 1080</button>
        <button type="button" data-export="1080x1350">1080 x 1350</button>
      </div>
      <p id="status" class="status">Samples loaded. Make it yours.</p>
    </div>
  </aside>
</main>
<script src="src/studio.js"></script>
</body>
</html>
